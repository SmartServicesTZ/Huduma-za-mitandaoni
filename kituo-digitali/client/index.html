<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#06152d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/Huduma-za-mitandaoni/manifest.webmanifest?v=4" />
    <meta name="description" content="HUDUMA ZA MTANDAONI — huduma za kidigitali, tokeni, mafunzo na msaada wa huduma za serikali na biashara." />
    <title>SmartServicesTZ — Huduma za Mtandaoni</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "adfb1cbb-bb91-4813-b2c8-c57453319649",
          serviceWorkerPath: "/Huduma-za-mitandaoni/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/Huduma-za-mitandaoni/" }
        });
      });
    </script>
  </head>
  <body>
    <div id="root">

    </div>
    <script>
      window.addEventListener("error", function (event) {
        var target = event.target;
        if (target && target.tagName === "SCRIPT") {
          var message = document.getElementById("startup-message");
          if (message) message.textContent = "Faili za mfumo hazijapakia. Hakikisha intaneti inafanya kazi, kisha gusa Jaribu tena.";
        }
      }, true);
      window.addEventListener("unhandledrejection", function () {
        var message = document.getElementById("startup-message");
        if (message && document.getElementById("startup-fallback")) {
          message.textContent = "Mfumo umepata hitilafu wakati wa kufunguka. Tafadhali gusa Jaribu tena.";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
