name: Convert Business License DOCX Template

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-license-template.yml'
      - 'kituo-digitali/client/public/license-assets/Licence 3.docx'

permissions:
  contents: read

jobs:
  convert-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils unzip file

      - name: Validate DOCX and convert
        shell: bash
        run: |
          set -euxo pipefail
          INPUT="$GITHUB_WORKSPACE/kituo-digitali/client/public/license-assets/Licence 3.docx"
          OUT="/tmp/license-convert"
          PROFILE="file:///tmp/lo-profile-license"
          mkdir -p "$OUT"
          test -f "$INPUT"
          ls -lh "$INPUT"
          file "$INPUT"
          unzip -t "$INPUT"
          libreoffice -env:UserInstallation="$PROFILE" --headless --convert-to pdf --outdir "$OUT" "$INPUT"
          test -s "$OUT/Licence 3.pdf"
          pdfinfo "$OUT/Licence 3.pdf" | head -15
          pdftoppm -f 1 -l 1 -png -r 180 -singlefile "$OUT/Licence 3.pdf" "$OUT/business-license-template"
          ls -lh "$OUT/"

      - name: Upload converted template for review
        uses: actions/upload-artifact@v4
        with:
          name: converted-business-license-template
          path: |
            /tmp/license-convert/business-license-template.png
            /tmp/license-convert/Licence 3.pdf
          if-no-files-found: error
          retention-days: 3
