name: Convert Business License DOCX Template

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-license-template.yml'
      - 'kituo-digitali/client/public/license-assets/Licence 3.docx'

permissions:
  contents: write

jobs:
  convert-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils unzip file

      - name: Repair DOCX archive and convert
        shell: bash
        run: |
          set -euxo pipefail
          INPUT="$GITHUB_WORKSPACE/kituo-digitali/client/public/license-assets/Licence 3.docx"
          OUT="/tmp/license-convert"
          mkdir -p "$OUT"
          file "$INPUT"
          python3 - "$INPUT" "$OUT/Licence-3-repaired.docx" <<'PY'
          import sys, zipfile, struct, zlib
          source, target = sys.argv[1:3]
          with open(source, 'rb') as rawfile, zipfile.ZipFile(source, 'r') as zin, zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  try:
                      data = zin.read(info.filename)
                  except Exception:
                      # Recover entries whose ZIP CRC metadata is broken by reading their
                      # compressed payload directly and recalculating the checksum on write.
                      rawfile.seek(info.header_offset)
                      header = rawfile.read(30)
                      fields = struct.unpack('<IHHHHHIIIHH', header)
                      name_len, extra_len = fields[-2], fields[-1]
                      rawfile.seek(info.header_offset + 30 + name_len + extra_len)
                      payload = rawfile.read(info.compress_size)
                      if info.compress_type == zipfile.ZIP_STORED:
                          data = payload
                      elif info.compress_type == zipfile.ZIP_DEFLATED:
                          data = zlib.decompress(payload, -15)
                      else:
                          raise RuntimeError(f"Unsupported compression for {info.filename}")
                      print(f"Recovered damaged CRC entry {info.filename}: {len(data)} bytes")
                  zout.writestr(info.filename, data)
                  print(f"Saved {info.filename}: {len(data)} bytes")
          PY
          unzip -t "$OUT/Licence-3-repaired.docx"
          libreoffice -env:UserInstallation=file:///tmp/lo-profile-license --headless --convert-to pdf --outdir "$OUT" "$OUT/Licence-3-repaired.docx"
          test -s "$OUT/Licence-3-repaired.pdf"
          pdfinfo "$OUT/Licence-3-repaired.pdf" | head -15
          pdftoppm -f 1 -l 1 -png -r 180 -singlefile "$OUT/Licence-3-repaired.pdf" "$OUT/business-license-template"
          ls -lh "$OUT/"

      - name: Commit converted PNG preview for integration
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/license-convert/business-license-template.png kituo-digitali/client/public/license-assets/business-license-template-new.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kituo-digitali/client/public/license-assets/business-license-template-new.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add converted business license template preview"
          git push

      - name: Upload converted template for review
        uses: actions/upload-artifact@v4
        with:
          name: converted-business-license-template
          path: |
            /tmp/license-convert/business-license-template.png
            /tmp/license-convert/Licence-3-repaired.pdf
            /tmp/license-convert/Licence-3-repaired.docx
          if-no-files-found: error
          retention-days: 3
