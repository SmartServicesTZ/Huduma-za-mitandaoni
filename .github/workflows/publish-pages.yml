name: Validate SmartServicesTZ Pages build

on:
  push:
    branches:
      - main
    paths:
      - "kituo-digitali/client/**"
      - "kituo-digitali/shared/**"
      - "kituo-digitali/package.json"
      - "kituo-digitali/pnpm-lock.yaml"
      - "kituo-digitali/vite.config.ts"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartservicestz-pages-validation
  cancel-in-progress: true

jobs:
  validate-production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kituo-digitali
        run: pnpm install --frozen-lockfile

      - name: Build production frontend
        working-directory: kituo-digitali
        env:
          GITHUB_ACTIONS: "true"
          VITE_FIREBASE_STORAGE_READY: "false"
        run: pnpm build

      - name: Verify production build output
        run: test -f kituo-digitali/dist/public/index.html
