name: SmartServicesTZ Website Health Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smartservicestz-health-monitor
  cancel-in-progress: false

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check live website
        id: health
        shell: bash
        run: |
          set +e
          code=$(curl --location --silent --show-error --output /tmp/site.html --write-out "%{http_code}" --connect-timeout 15 --max-time 40 --retry 2 --retry-delay 3 https://smartservicestz.github.io/Huduma-za-mitandaoni/)
          curl_status=$?
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$curl_status" -ne 0 ] || [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "Website check failed. curl exit=$curl_status, HTTP=$code"
            exit 1
          fi
          if ! grep -Eiq 'SmartServicesTZ|Huduma za mtandaoni|huduma za mtandaoni' /tmp/site.html; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "HTTP response was received, but expected website content was not found."
            exit 1
          fi
          api_code=$(curl --location --silent --show-error --output /tmp/api-health.json --write-out "%{http_code}" --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 2 https://huduma-za-mtandao-api.stewardjackson999.workers.dev/health)
          if [ "$api_code" -lt 200 ] || [ "$api_code" -ge 400 ] || ! grep -Eiq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/api-health.json; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "Firebase-backed API health check failed. HTTP=$api_code"
            exit 1
          fi
          echo "api_http_code=$api_code" >> "$GITHUB_OUTPUT"
          echo "healthy=true" >> "$GITHUB_OUTPUT"
          echo "Website returned HTTP $code, Firebase-backed API returned HTTP $api_code, and expected content was found."
      - name: Open or update incident alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Website health alert: SmartServicesTZ may be down";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            const details = [
              "The scheduled health check could not confirm that SmartServicesTZ is serving the expected homepage.",
              "",
              "- Website: https://smartservicestz.github.io/Huduma-za-mitandaoni/",
              "- Time (UTC): " + new Date().toISOString(),
              "- Workflow run: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId,
              "",
              "This check verifies the public homepage, the Firebase-backed Worker health endpoint, and expected page text. Browser-side JavaScript/Firebase errors are recorded by the admin dashboard monitor.",
              "The monitor will close this issue automatically after a later successful check."
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "The site health check failed again.\n\n" + details
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body: details,
                labels: ["website-health"]
              }).catch(async (err) => {
                if (err.status !== 422) throw err;
                await github.rest.issues.create({ owner, repo, title, body: details });
              });
            }
      - name: Close alert after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Website health alert: SmartServicesTZ may be down";
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "The website health check has recovered. Homepage response and expected content were verified at " + new Date().toISOString() + " (UTC)."
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: "closed"
              });
            }
