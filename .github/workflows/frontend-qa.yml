name: Frontend and Worker QA

on:
  push:
    branches:
      - main
      - fix/admin-list-date-ordering-main
    paths:
      - "kituo-digitali/**"
      - ".github/workflows/frontend-qa.yml"
  pull_request:
    paths:
      - "kituo-digitali/**"
      - ".github/workflows/frontend-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type-check, tests, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kituo-digitali
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Run frontend tests
        run: pnpm test
      - name: Test Firestore security rules in emulator
        run: pnpm test:firestore:rules
      - name: Build frontend and server bundle
        run: pnpm build

  worker:
    name: Cloudflare Worker type-check, tests, and build validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kituo-digitali/worker
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: kituo-digitali
      - name: Type-check Worker
        run: pnpm check
      - name: Run Worker tests
        run: pnpm test
      - name: Validate Worker deployment bundle
        run: pnpm build
