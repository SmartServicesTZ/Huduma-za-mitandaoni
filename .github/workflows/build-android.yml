name: Build SmartServicesTZ Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create native Android app wrapper
        run: |
          rm -rf android-app
          mkdir -p android-app/app/src/main/java/tz/steward/huduma
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'SmartServicesTZ'
          include ':app'
          EOF

          cat > android-app/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          
          android { namespace 'tz.steward.huduma'; compileSdk 35
              defaultConfig { applicationId 'tz.steward.huduma'; minSdk 23; targetSdk 35; versionCode 6; versionName '4.2.0' }
          }
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' }
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application android:theme="@style/AppTheme" android:label="SmartServicesTZ" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:resizeableActivity="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 pwa-icon.svg -o android-app/app/src/main/res/drawable/app_icon.png

          for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair
            size=$2
            rsvg-convert -w $size -h $size pwa-icon.svg -o android-app/app/src/main/res/mipmap-$1/ic_launcher.png
          done

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7C3AED</item>
                  <item name="android:statusBarColor">#06152D</item>
                  <item name="android:navigationBarColor">#06152D</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/java/tz/steward/huduma/MainActivity.java <<'EOF'
          package tz.steward.huduma;

          import android.app.Activity;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int FILE_CHOOSER = 1001;
              private static final int MEDIA_PERMISSION_REQUEST = 1002;
              private PermissionRequest pendingWebPermissionRequest;
              private static final String HOME = "https://smartservicestz.github.io/Huduma-za-mitandaoni/?app=android-v6";
              private WebView webView;
              private SwipeRefreshLayout refreshLayout;
              private ValueCallback<Uri[]> fileCallback;
              private OutputStream nativeOutput;
              private Uri nativeUri;

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView button(String text, int size) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextColor(Color.WHITE);
                  v.setTextSize(size);
                  v.setGravity(Gravity.CENTER);
                  v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  v.setPadding(dp(14), 0, dp(14), 0);
                  return v;
              }

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(6,21,45));
                  getWindow().setNavigationBarColor(Color.rgb(6,21,45));
                  requestNotificationPermission();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(246,248,252));

                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);
                  toolbar.setPadding(dp(6), 0, dp(6), 0);
                  GradientDrawable toolbarBg = new GradientDrawable();
                  toolbarBg.setColor(Color.rgb(6,21,45));
                  toolbar.setBackground(toolbarBg);

                  TextView back = button("‹", 34);
                  back.setContentDescription("Rudi nyuma");
                  toolbar.addView(back, new LinearLayout.LayoutParams(dp(52), dp(52)));
                  
                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL);
                  titleBox.setGravity(Gravity.CENTER_VERTICAL);
                  TextView title = button("SmartServicesTZ", 15);
                  title.setGravity(Gravity.CENTER_VERTICAL);
                  TextView subtitle = button("Huduma za Mtandaoni", 10);
                  subtitle.setTextColor(Color.rgb(190,205,225));
                  subtitle.setTypeface(Typeface.DEFAULT, Typeface.NORMAL);
                  titleBox.addView(title, new LinearLayout.LayoutParams(-1, dp(25)));
                  titleBox.addView(subtitle, new LinearLayout.LayoutParams(-1, dp(18)));
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(0, dp(52), 1);
                  toolbar.addView(titleBox, titleParams);

                  TextView refresh = button("↻", 28);
                  refresh.setContentDescription("Refresh");
                  toolbar.addView(refresh, new LinearLayout.LayoutParams(dp(56), dp(52)));

                  refreshLayout = new SwipeRefreshLayout(this);
                  webView = new WebView(this);
                  refreshLayout.addView(webView, new ViewGroup.LayoutParams(-1, -1));
                  root.addView(toolbar, new LinearLayout.LayoutParams(-1, dp(52)));
                  root.addView(refreshLayout, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);

                  back.setOnClickListener(v -> goBack());
                  back.setEnabled(true);
                  refresh.setOnClickListener(v -> refreshPage());
                  refreshLayout.setOnRefreshListener(() -> { webView.clearCache(true); webView.reload(); });
                  refreshLayout.setColorSchemeColors(Color.rgb(124,58,237), Color.rgb(37,99,235));

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportMultipleWindows(false);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  s.setUserAgentString(s.getUserAgentString() + " SmartServicesTZApp/4.2.0");
                  webView.addJavascriptInterface(new DownloadBridge(), "AndroidDownload");

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String host = u.getHost();
                          String scheme = u.getScheme();
                          if ("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme)) {
                              return false;
                          }
                          if ("tel".equalsIgnoreCase(scheme) || "mailto".equalsIgnoreCase(scheme) || "sms".equalsIgnoreCase(scheme)) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                          }
                          return true;
                      }

                      @Override public void onPageFinished(WebView view, String url) {
                          if (refreshLayout != null) refreshLayout.setRefreshing(false);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (request == null || request.getOrigin() == null
                                      || !(request.getOrigin().toString().equals("https://smartservicestz.github.io") || request.getOrigin().toString().startsWith("https://smartservicestz.github.io/"))) {
                                  if (request != null) request.deny();
                                  return;
                              }
                              boolean wantsAudio = false;
                              boolean wantsVideo = false;
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) wantsAudio = true;
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) wantsVideo = true;
                              }
                              java.util.ArrayList<String> missing = new java.util.ArrayList<>();
                              if (wantsAudio && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) missing.add(Manifest.permission.RECORD_AUDIO);
                              if (wantsVideo && ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) missing.add(Manifest.permission.CAMERA);
                              if (missing.isEmpty()) {
                                  request.grant(request.getResources());
                              } else {
                                  if (pendingWebPermissionRequest != null) pendingWebPermissionRequest.deny();
                                  pendingWebPermissionRequest = request;
                                  ActivityCompat.requestPermissions(MainActivity.this, missing.toArray(new String[0]), MEDIA_PERMISSION_REQUEST);
                              }
                          });
                      }
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              Intent i = params.createIntent();
                              startActivityForResult(i, FILE_CHOOSER);
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception ignored) {}
                  });

                  if (state == null) webView.loadUrl(HOME);
                  else webView.restoreState(state);
              }


              private void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1003);
                  }
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode != MEDIA_PERMISSION_REQUEST) return;
                  PermissionRequest pending = pendingWebPermissionRequest;
                  pendingWebPermissionRequest = null;
                  if (pending == null) return;
                  boolean granted = grantResults.length > 0;
                  for (int result : grantResults) if (result != PackageManager.PERMISSION_GRANTED) granted = false;
                  if (granted) pending.grant(pending.getResources()); else pending.deny();
              }

              private void beginNativeFile(String name, String mimeType) throws Exception {
                  cancelNativeFile();
                  String safeName = name == null ? "smartservicestz-document" : name.replaceAll("[^A-Za-z0-9._-]", "_");
                  String safeMime = mimeType == null || mimeType.isEmpty() ? "application/octet-stream" : mimeType;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.DISPLAY_NAME, safeName);
                      values.put(MediaStore.Downloads.MIME_TYPE, safeMime);
                      values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/SmartServicesTZ");
                      values.put(MediaStore.Downloads.IS_PENDING, 1);
                      nativeUri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (nativeUri == null) throw new Exception("Downloads folder haikupatikana.");
                      nativeOutput = getContentResolver().openOutputStream(nativeUri);
                  } else {
                      File directory = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "SmartServicesTZ");
                      if (!directory.exists() && !directory.mkdirs()) throw new Exception("Downloads folder haikuundwa.");
                      nativeUri = null;
                      nativeOutput = new FileOutputStream(new File(directory, safeName));
                  }
                  if (nativeOutput == null) throw new Exception("Faili haikufunguka.");
              }

              private void appendNativeFileChunk(String base64Chunk) throws Exception {
                  if (nativeOutput == null) throw new Exception("Faili halijaanzishwa.");
                  nativeOutput.write(Base64.decode(base64Chunk, Base64.DEFAULT));
              }

              private void finishNativeFile() throws Exception {
                  if (nativeOutput == null) throw new Exception("Faili halijaanzishwa au limekatika.");
                  nativeOutput.flush();
                  nativeOutput.close();
                  nativeOutput = null;
                  if (nativeUri != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.IS_PENDING, 0);
                      int updated = getContentResolver().update(nativeUri, values, null, null);
                      if (updated <= 0) throw new Exception("Android haikuweza kukamilisha kuhifadhi faili.");
                  }
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, "Faili limehifadhiwa kwenye Downloads/SmartServicesTZ", Toast.LENGTH_LONG).show());
              }

              private void cancelNativeFile() {
                  try { if (nativeOutput != null) nativeOutput.close(); } catch (Exception ignored) {}
                  nativeOutput = null;
                  if (nativeUri != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      try { getContentResolver().delete(nativeUri, null, null); } catch (Exception ignored) {}
                  }
                  nativeUri = null;
              }

              private final class DownloadBridge {
                  @JavascriptInterface public boolean beginFile(String name, String mimeType) {
                      try { beginNativeFile(name, mimeType); return true; } catch (Exception e) { cancelNativeFile(); return false; }
                  }
                  @JavascriptInterface public boolean appendFileChunk(String base64Chunk) {
                      try { appendNativeFileChunk(base64Chunk); return true; }
                      catch (Exception e) { cancelNativeFile(); runOnUiThread(() -> Toast.makeText(MainActivity.this, "Imeshindikana kuandika faili. Jaribu tena.", Toast.LENGTH_LONG).show()); return false; }
                  }
                  @JavascriptInterface public boolean finishFile() {
                      try { finishNativeFile(); return true; }
                      catch (Exception e) { cancelNativeFile(); runOnUiThread(() -> Toast.makeText(MainActivity.this, "Download imeshindikana.", Toast.LENGTH_LONG).show()); return false; }
                  }
                  @JavascriptInterface public void cancelFile() { cancelNativeFile(); }
              }

              private void goBack() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      finish();
                  }
              }

              private void refreshPage() {
                  if (webView != null) {
                      refreshLayout.setRefreshing(true);
                      webView.reload();
                  }
              }

              @Override public void onBackPressed() {
                  goBack();
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER && fileCallback != null) {
                      Uri[] result = (resultCode == RESULT_OK && data != null && data.getData() != null)
                              ? new Uri[]{data.getData()} : null;
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
              }

              @Override protected void onSaveInstanceState(Bundle out) {
                  webView.saveState(out);
                  super.onSaveInstanceState(out);
              }

              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Build standalone APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare public APK filename
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk android-app/app/build/outputs/apk/debug/SmartServicesTZ.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: smartservicestz-standalone-apk-v4
          path: android-app/app/build/outputs/apk/debug/SmartServicesTZ.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK for public download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smartservicestz-latest
          name: SmartServicesTZ Android App
          body: "Toleo la sasa la SmartServicesTZ kwa Android. Pakua SmartServicesTZ.apk na usakinishe kwenye simu yako."
          files: android-app/app/build/outputs/apk/debug/SmartServicesTZ.apk
          overwrite_files: true
          make_latest: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
