name: Build SmartServicesTZ Android APK + Play Store AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Generate TWA project without interactive prompts
        run: |
          rm -rf android-twa
          mkdir -p android-twa
          cat > android-twa/twa-manifest.json <<'EOF'
          {
            "manifestVersion": "1",
            "name": "SmartServicesTZ",
            "launcherName": "SmartServicesTZ",
            "packageId": "tz.steward.huduma",
            "host": "smartservicestz.github.io",
            "startUrl": "/Huduma-za-mitandaoni/?v=4",
            "webManifestUrl": "https://smartservicestz.github.io/Huduma-za-mitandaoni/manifest.webmanifest?v=4",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#06152d",
            "themeColorDark": "#06152d",
            "navigationColor": "#06152d",
            "navigationColorDark": "#06152d",
            "navigationDividerColor": "#06152d",
            "navigationDividerColorDark": "#06152d",
            "backgroundColor": "#06152d",
            "iconUrl": "https://smartservicestz.github.io/Huduma-za-mitandaoni/pwa-icon.svg?v=4",
            "maskableIconUrl": "https://smartservicestz.github.io/Huduma-za-mitandaoni/pwa-icon.svg?v=4",
            "splashScreenFadeOutDuration": 650,
            "enableNotifications": true,
            "appVersionCode": 5,
            "appVersionName": "4.0.0",
            "minSdkVersion": 23,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "@bubblewrap/cli"
          }
          EOF
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cd android-twa
          bubblewrap update --skipVersionUpgrade --manifest="./twa-manifest.json"
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-twa/android.keystore
          test -s android-twa/android.keystore
          cat > android-twa/release-signing.properties <<EOF
          storeFile=android.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Configure release signing
        working-directory: android-twa
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "release-signing.properties" not in s:
              signing = '''\nimport java.util.Properties\n\ndef releaseProps = new Properties()\ndef releasePropsFile = rootProject.file("release-signing.properties")\nif (releasePropsFile.exists()) { releasePropsFile.withInputStream { releaseProps.load(it) } }\n\nandroid {\n    signingConfigs {\n        release {\n            if (releasePropsFile.exists()) {\n                storeFile rootProject.file(releaseProps['storeFile'])\n                storePassword releaseProps['storePassword']\n                keyAlias releaseProps['keyAlias']\n                keyPassword releaseProps['keyPassword']\n            }\n        }\n    }\n}\n'''
              s = signing + s
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('buildTypes {', 'buildTypes {\\n        release {\\n            signingConfig signingConfigs.release\\n        }', 1)
          p.write_text(s)
          PY
      - name: Build release APK and Play Store AAB
        working-directory: android-twa
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: smartservicestz-playstore-release-v4
          path: |
            android-twa/app/build/outputs/apk/release/app-release.apk
            android-twa/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14