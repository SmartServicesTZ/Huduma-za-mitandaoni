name: Build $teward Tz Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Generate TWA project without interactive prompts
        run: |
          rm -rf android-twa
          mkdir -p android-twa
          cat > android-twa/twa-manifest.json <<'EOF'
          {
            "manifestVersion": "1",
            "name": "$teward Tz",
            "launcherName": "$teward Tz",
            "packageId": "tz.steward.huduma",
            "host": "steward-tz.github.io",
            "startUrl": "/Huduma-za-mtandao/",
            "webManifestUrl": "https://steward-tz.github.io/Huduma-za-mtandao/manifest.webmanifest",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#071a36",
            "themeColorDark": "#071a36",
            "navigationColor": "#071a36",
            "navigationColorDark": "#071a36",
            "navigationDividerColor": "#071a36",
            "navigationDividerColorDark": "#071a36",
            "backgroundColor": "#071a36",
            "iconUrl": "https://steward-tz.github.io/Huduma-za-mtandao/pwa-icon.svg",
            "maskableIconUrl": "https://steward-tz.github.io/Huduma-za-mtandao/pwa-icon.svg",
            "splashScreenFadeOutDuration": 300,
            "enableNotifications": true,
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "minSdkVersion": 23,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "@bubblewrap/cli"
          }
          EOF
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cd android-twa
          bubblewrap update --skipVersionUpgrade --manifest="./twa-manifest.json"

      - name: Build debug APK
        working-directory: android-twa
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: steward-tz-debug-apk
          path: android-twa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
