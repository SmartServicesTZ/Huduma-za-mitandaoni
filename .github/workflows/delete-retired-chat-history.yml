name: Delete retired Chat history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-retired-chat-history.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE_CHAT_HISTORY to permanently delete retired Chat Firestore data'
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-chat-history:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[delete-chat-history]')) || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DELETE_CHAT_HISTORY') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deletion confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DELETE_CHAT_HISTORY" ]; then
            echo "Confirmation did not match; no data was deleted."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Delete retired Chat collections recursively
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is missing; no data was deleted."
            exit 1
          fi
          project="huduma-za-mtandaoni-b1c0c"
          for collection in publicChatMessages conversations chatGroups callSessions userBlocks userPresence chatReports; do
            echo "Deleting retired Chat collection: $collection"
            firebase firestore:delete "$collection" --recursive --force --project "$project" --token "$FIREBASE_TOKEN"
          done
          echo "Firestore Chat collection deletion commands completed."
