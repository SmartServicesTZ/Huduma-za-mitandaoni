name: Deploy website and Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kituo-digitali
        run: pnpm install --frozen-lockfile

      - name: Type-check, test, and bundle Worker
        working-directory: kituo-digitali
        run: pnpm check && pnpm test && pnpm worker:check && pnpm worker:test && pnpm worker:build

      - name: Optional production Worker check
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          API_URL: ${{ vars.VITE_CLOUDFLARE_WORKER_URL }}
          EXPECTED_API_URL: https://huduma-za-mtandao-api.stewardjackson999.workers.dev
        run: echo "Continuing with deployment; optional Worker configuration is handled separately."

      - name: Verify production API before frontend build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          API_URL: ${{ vars.VITE_CLOUDFLARE_WORKER_URL }}
        run: |
          test -n "$API_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$API_URL/ready" | jq -e '.ready == true'

      - name: Build frontend
        working-directory: kituo-digitali
        env:
          VITE_CLOUDFLARE_WORKER_URL: ${{ vars.VITE_CLOUDFLARE_WORKER_URL }}
          VITE_PAYMENT_FLOWS_ENABLED: ${{ vars.VITE_PAYMENT_FLOWS_ENABLED }}
          VITE_FIREBASE_STORAGE_READY: ${{ vars.VITE_FIREBASE_STORAGE_READY }}
        run: pnpm build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: kituo-digitali/dist/public

  deploy-worker:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VITE_CLOUDFLARE_WORKER_URL != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    needs: [build, deploy-firebase-rules]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kituo-digitali
        run: pnpm install --frozen-lockfile

      - name: Deploy Cloudflare Worker
        working-directory: kituo-digitali/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      - name: Verify core Worker readiness
        env:
          API_URL: ${{ vars.VITE_CLOUDFLARE_WORKER_URL }}
        run: |
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "$API_URL/ready")
          echo "$response" | jq -e '.ready == true'

  deploy-firebase-rules:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.FIREBASE_TOKEN != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firestore rules and optional Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_STORAGE_READY: ${{ vars.VITE_FIREBASE_STORAGE_READY }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Add the FIREBASE_TOKEN secret before deploying Firestore rules. Pages and Worker deployment are blocked to avoid stale production permissions."
            exit 1
          fi
          pnpm dlx firebase-tools deploy --only firestore:rules --project huduma-za-mtandaoni-b1c0c --token "$FIREBASE_TOKEN" --non-interactive
          if [ "$FIREBASE_STORAGE_READY" = "true" ]; then
            pnpm dlx firebase-tools deploy --only storage --project huduma-za-mtandaoni-b1c0c --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::notice::Firebase Storage is not provisioned; Storage rules are skipped and chat media controls remain disabled."
          fi

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
