name: Deploy $teward Tz website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Also deploy the Cloudflare Worker API
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kituo-digitali
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: kituo-digitali
        env:
          VITE_CLOUDFLARE_WORKER_URL: ${{ vars.VITE_CLOUDFLARE_WORKER_URL }}
          VITE_PAYMENT_FLOWS_ENABLED: ${{ vars.VITE_PAYMENT_FLOWS_ENABLED }}
          VITE_FIREBASE_STORAGE_READY: "false"
        run: pnpm build

      - name: Prepare GitHub Pages SPA fallback
        working-directory: kituo-digitali
        run: |
          test -f dist/public/index.html
          cp dist/public/index.html dist/public/404.html
          echo "Pages artifact ready with SPA 404 fallback."

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: kituo-digitali/dist/public

  detect-worker-changes:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.detect.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Worker changes or explicit manual request
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DEPLOY_WORKER: ${{ inputs.deploy_worker }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=$DEPLOY_WORKER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          if printf '%s\n' "$changed_files" | grep -Eq '^(kituo-digitali/worker/|kituo-digitali/shared/(tanzaniaPhone|accountAccess)\.ts$|kituo-digitali/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$)'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-worker:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.detect-worker-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: [build, detect-worker-changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kituo-digitali/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kituo-digitali
        run: pnpm install --frozen-lockfile

      - name: Ensure Lipa documents R2 bucket exists
        working-directory: kituo-digitali
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm --filter @huduma/cloudflare-worker exec wrangler r2 bucket list | grep -Fq "smartservices-lipa-documents"; then
            echo "R2 bucket already exists."
          else
            pnpm --filter @huduma/cloudflare-worker exec wrangler r2 bucket create smartservices-lipa-documents
          fi

      - name: Deploy Cloudflare Worker API
        working-directory: kituo-digitali
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm worker:deploy

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
